# ============================================================================
# MeedyaConverter HTTP API — OpenAPI Specification
# Copyright © 2026 MWBM Partners Ltd. All rights reserved.
#
# ============================================================================
#                          ****  ALPHA STATUS  ****
#
# `APIServer` (Sources/ConverterEngine/Server/APIServer.swift) is a real
# `NWListener`-based TCP/HTTP server backed by the real `EncodingEngine`.
# All five routes below do genuine work:
#   - POST /encode calls `EncodingQueue.addJob` (handleEncode, :521). The
#     returned `jobId` is the real job's ID and the job appears in
#     GET /queue (and, if the injected engine is the app's live one, the
#     Job Queue UI).
#   - POST /probe awaits the real `EncodingEngine.probe(url:)`
#     (handleProbe, :600) and returns real duration, container, stream
#     counts, and HDR detection.
#   - GET /status returns the real app version (`AppInfo.Version
#     .displayString`) and a real uptime computed from the listener's
#     start time (handleStatus, :656).
#   - GET /queue reads `engine.queue.jobsSnapshot()` (handleQueue, :674).
#   - GET /profiles reads `engine.profileStore.allProfiles()` — built-in
#     AND user-created profiles (handleProfiles, :703).
# Bearer-token authentication, CORS preflight, and the 404 fallback are
# also real, as documented below.
#
# It is started with `meedya-convert serve --port <port> --api-key <key>`
# (Sources/meedya-convert/Commands/ServeCommand.swift), the CLI's `serve`
# subcommand, registered in `Sources/meedya-convert/MeedyaConvert.swift`.
# This is currently the ONLY way to start the server — the GUI's
# `APIServerView` (Sources/MeedyaConverter/Views/APIServerView.swift) has
# no `NavigationItem` case and no `ContentView` detail arm, so it is
# unreachable from the app's UI (tracked by #448, alongside #355).
#
# Standing limitations (verified against source, not fixed by this doc):
#   - **Queue runner not started.** POST /encode enqueues the job but
#     nothing drives the queue — neither this endpoint nor
#     `meedya-convert serve` starts a runner. Jobs sit in `queued` status
#     until something else processes them (in the desktop app, that's
#     `AppViewModel.startQueue()`). This mirrors the desktop app's own
#     "Add to Queue" button without "Start Queue".
#   - **All-interfaces bind.** `APIServer` has no `--host`/bind-address
#     option; the listener accepts connections on every interface, not
#     just loopback.
#   - **`APIServerView` is orphaned.** See above — it still exists and
#     still compiles, but nothing in the app's navigation can reach it.
# ============================================================================
#
# Updated: 2026-09-02 — reconciled against
# Sources/ConverterEngine/Server/APIServer.swift and
# Sources/ConverterEngine/Encoding/EncodingJob.swift (Issue #286's
# bounded-concurrency queue runner). Two corrections from this pass:
#   - `QueueJob.status` was missing `cancelled`, a real
#     `EncodingJobStatus` case a job keeps until `clearFinished()` is
#     called.
#   - `activeJobs` is a plain in-flight count, not a 0/1 flag — since
#     #286 more than one job can be `.encoding` at once, though this is
#     not observable via `meedya-convert serve` (nothing drives the
#     queue) or today's orphaned `APIServerView` (see "Standing
#     limitations" above; both facts are unchanged by #286).
# ============================================================================

openapi: 3.1.0
info:
  title: MeedyaConverter HTTP API (alpha — see #355)
  version: 0.0.0-experimental
  description: |
    **Alpha-quality but functionally real.** Lightweight REST API exposed
    by `APIServer`, a hand-rolled `NWListener`-based HTTP/1.1 server used
    for headless/remote control of MeedyaConverter. Start it with
    `meedya-convert serve --port <port> --api-key <key>` — this is
    currently the only way to start it; the GUI's `APIServerView` exists
    but has no navigation entry, so it cannot be reached from the app
    (tracked by #448).

    All five routes are backed by the real `EncodingEngine`: `POST /encode`
    genuinely enqueues onto `EncodingQueue`, `POST /probe` genuinely runs
    FFprobe via `EncodingEngine.probe(url:)`, `GET /queue` and
    `GET /profiles` read the engine's live queue and profile store, and
    `GET /status` returns the real app version and a real uptime.
    Bearer-token authentication, CORS preflight, and the 404 fallback are
    also real.

    **Known limitations:**
    - `POST /encode` enqueues the job but does not start the queue
      runner — nothing currently does, from this API or from
      `meedya-convert serve` itself — so a job sits in `queued` status
      until something else drives the queue (see that operation's
      description below).
    - The listener binds all interfaces; `APIServer` has no
      `--host`/bind-address option to restrict it to loopback.

    **Transport quirks (verified against source):**
    - Each accepted TCP connection is read with exactly one
      `NWConnection.receive(minimumIncompleteLength: 1, maximumLength: 65536)`
      call — there is no loop to accumulate a request that arrives
      split across multiple reads. A request (headers + body) larger
      than what a single read delivers, or delivered as multiple TCP
      segments the kernel doesn't coalesce, may be parsed incompletely
      instead of being reassembled.
    - Every response is sent with `Connection: close`; the server does
      not support HTTP keep-alive. One TCP connection is used per
      request.
    - The request-line/header parser splits the raw bytes on literal
      `"\r\n"` and does not support chunked transfer-encoding.
    - `Access-Control-Allow-Origin: *` is sent on every response
      (including error responses), so any origin can call this API
      from a browser once it has a valid bearer token.
  contact:
    name: MWBM Partners Ltd
    url: https://github.com/MWBMPartners/MeedyaConverter
  license:
    name: Proprietary
    url: https://github.com/MWBMPartners/MeedyaConverter/blob/main/LICENSE

servers:
  - url: "http://localhost:8484"
    description: >-
      Default port (the `APIServer(port:apiKey:)` initialiser default is
      8484; override with `meedya-convert serve --port <port>`). Only
      reachable while a user has run `meedya-convert serve` — nothing
      starts it automatically, and the listener binds all interfaces,
      not just loopback.

security:
  - bearerToken: []

paths:
  # --------------------------------------------------------------------------
  # POST /encode — real: enqueues onto the live EncodingQueue
  # --------------------------------------------------------------------------
  /encode:
    post:
      operationId: httpEncode
      summary: "Submit an encoding job to the real encoding queue"
      x-tracking-issue: "#355"
      description: |
        Real behaviour. `handleEncode` validates that the JSON body has
        string `input` and `output` fields and that `input` exists on
        disk, resolves `profile` (by name, case-insensitively, against
        `engine.profileStore.profile(named:)`) or defaults to the
        built-in `Web Standard` profile, then calls
        `EncodingQueue.addJob` on the real, injected `EncodingEngine`.
        The returned `jobId` is that job's real ID: it appears in
        `GET /queue` and, if the injected engine is the app's live one,
        the Job Queue UI.

        **Known limitation — the queue runner is not started.** This
        endpoint (and `meedya-convert serve` itself) only enqueues the
        job; nothing drives the queue to actually run FFmpeg on it. The
        job sits in `queued` status until something else processes the
        queue (in the desktop app, `AppViewModel.startQueue()`) — this
        mirrors the desktop app's own "Add to Queue" button without
        "Start Queue". The response's `note` field states this plainly.
      tags:
        - Encoding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, output]
              properties:
                input:
                  type: string
                  description: Source file path. Must exist on disk — a missing file returns 400.
                output:
                  type: string
                  description: Destination file path. Not validated or created by this call; only used to build the job config.
                profile:
                  type: string
                  description: >-
                    Encoding profile name, matched case-insensitively
                    against `engine.profileStore.allProfiles()` (built-in
                    and user-created — see `GET /profiles`). An unknown
                    name returns 400. Defaults to the built-in
                    `"Web Standard"` profile if omitted.
      responses:
        "202":
          description: "Job accepted and enqueued onto the real encoding queue."
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: The real, trackable job ID (`EncodingJobConfig.id`) — appears in `GET /queue`.
                  status:
                    type: string
                    enum: [queued]
                  input:
                    type: string
                  output:
                    type: string
                  profile:
                    type: string
                    description: Name of the resolved profile actually attached to the job.
                  note:
                    type: string
                    description: States the queue-runner limitation described above.
        "400":
          description: "`input`/`output` missing or non-string, `input` does not exist on disk, or `profile` does not match any known profile."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # --------------------------------------------------------------------------
  # POST /probe — real: awaits EncodingEngine.probe(url:) (FFprobe)
  # --------------------------------------------------------------------------
  /probe:
    post:
      operationId: httpProbe
      summary: "Probe a media file for stream/container information via the real EncodingEngine"
      x-tracking-issue: "#355"
      description: |
        Real behaviour. `handleProbe` checks that `path` exists, then
        awaits the real, `async` `EncodingEngine.probe(url:)` (FFprobe
        under the hood) and returns its duration, container name, stream
        counts, and HDR detection. This is a smaller field set than
        `meedya-convert probe --format json` (compare
        `#/components/schemas/MediaFile` in `meedya-convert-api.yaml`),
        not a different, fabricated shape — it derives the counts from
        the same `MediaFile` the CLI probe path produces.

        If the injected `EncodingEngine` has not yet been `configure()`d
        by whoever owns it (its FFmpeg/FFprobe binary locations), the
        probe call throws and this endpoint honestly reports that as a
        503 rather than guessing — see the handler's doc comment for why
        it does not call `configure()` itself (a cross-actor race with
        `AppViewModel.startQueue()` on the app's shared engine instance).
      tags:
        - Encoding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "200":
          description: "The file exists and was probed successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
        "404":
          description: "The file does not exist on disk. This is NOT the CLI's exit-code-4 \"probe failed\" (corrupt file, unreadable container) — a corrupt-but-present file returns 503, not 404."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeExistenceResponse'
        "400":
          description: "Real behaviour — returned when `path` is missing/non-string in the request body."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          description: "The file exists but the real prober failed — e.g. the injected engine has not been configured yet, or FFprobe rejected the file."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeFailedResponse'

  # --------------------------------------------------------------------------
  # GET /status — real: live version and uptime
  # --------------------------------------------------------------------------
  /status:
    get:
      operationId: httpStatus
      summary: Server status and basic system information.
      description: |
        Real behaviour. `handleStatus` returns `AppInfo.Version
        .displayString` for `version` (the actual app/CLI version, not a
        hardcoded literal) and a real `uptimeSeconds` computed from the
        `Date` captured when the listener started (`start()`'s
        `startTime`, reset to `nil` by `stop()`). `server`
        (`"MeedyaConverter API"`) and `status` (`"running"`) are
        constants, but true whenever this endpoint successfully responds
        at all (the server can't answer HTTP requests while stopped).
        `port` reflects the port this instance is bound to.
      tags:
        - Server
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    type: string
                    enum: ["MeedyaConverter API"]
                  version:
                    type: string
                    description: Real app/CLI version string (`AppInfo.Version.displayString`).
                  status:
                    type: string
                    enum: [running]
                  port:
                    type: integer
                    description: The real TCP port this server instance is bound to.
                  uptimeSeconds:
                    type: number
                    description: Real elapsed seconds since `start()` began listening. Not named `uptime`.
        "401":
          $ref: '#/components/responses/Unauthorized'

  # --------------------------------------------------------------------------
  # GET /queue — real: reads engine.queue.jobsSnapshot()
  # --------------------------------------------------------------------------
  /queue:
    get:
      operationId: httpQueue
      summary: "List the real encoding queue"
      x-tracking-issue: "#355"
      description: |
        Real behaviour. `handleQueue` reads
        `engine.queue.jobsSnapshot()` and maps each real job to its
        `jobId`/`input`/`output`/`profile`/`status`/`progress`. Jobs
        submitted via `POST /encode` — and, if the injected engine is
        the app's live one, jobs added through the GUI — appear here.
        `activeJobs` counts jobs with `status: "encoding"`; `pendingJobs`
        counts jobs with `status: "queued"`. `totalJobs` includes those
        plus any `paused`, `completed`, `failed`, or `cancelled` jobs, so
        it need not equal `activeJobs + pendingJobs`.

        **`activeJobs` can be greater than 1.** Since the bounded-concurrency
        queue runner (Issue #286), `EncodingQueue.claimNextPendingJob()` can
        mark several jobs `.encoding` at once — `activeJobs` is a plain
        count of however many that is right now, not a 0/1 flag. In
        practice this is not observable through either currently-reachable
        way of running this server, both unchanged by #286:
        `meedya-convert serve` never calls `claimNextPendingJob()` at all
        (see the queue-runner limitation above), so a CLI-started server's
        `activeJobs` stays `0` forever; and the GUI's `APIServerView`, which
        embeds a live, driven `EncodingQueue`, has no navigation entry to
        reach it (#448) and, even if reached, still defaults to its own
        standalone `EncodingEngine()` rather than the app's shared one (see
        `APIServerViewModel.engine`'s doc comment). A multi-job `activeJobs`
        value would only appear if a future caller wires `APIServerView` (or
        another `APIServer` instance) to the app's shared, queue-driving
        engine while the `.parallelEncoding` entitlement and a Max
        Concurrent Jobs width above 1 are both in effect.
      tags:
        - Encoding
      responses:
        "200":
          description: "The real, current state of the encoding queue."
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueJob'
                  totalJobs:
                    type: integer
                    description: Total number of jobs in the queue, in any status.
                  activeJobs:
                    type: integer
                    description: >-
                      Number of jobs with `status == "encoding"`. Not
                      clamped to 0/1 — since Issue #286's bounded-concurrency
                      queue runner, this can legitimately be greater than 1
                      when several jobs are claimed at once (see the
                      operation description above for why that is not
                      currently reachable through this API in practice).
                  pendingJobs:
                    type: integer
                    description: Number of jobs with `status == "queued"`.
        "401":
          $ref: '#/components/responses/Unauthorized'

  # --------------------------------------------------------------------------
  # GET /profiles — real: reads engine.profileStore.allProfiles()
  # --------------------------------------------------------------------------
  /profiles:
    get:
      operationId: httpProfiles
      summary: "List real encoding profiles — built-in and user-created"
      x-tracking-issue: "#355"
      description: |
        Real behaviour. `handleProfiles` reads
        `engine.profileStore.allProfiles()` — the same built-in and any
        user-created profiles `meedya-convert profiles --list` and the
        GUI's profile picker show (e.g. `"Web Standard"`,
        `"4K HDR Master"`) — and maps each to
        id/name/description/category/isBuiltIn/videoCodec/audioCodec/
        containerFormat. `videoCodec`/`audioCodec`/`containerFormat` are
        the `VideoCodec`/`AudioCodec`/`ContainerFormat` enum raw values
        (e.g. `"h264"`, `"aac"`), the same values `meedya-convert-api.yaml`
        documents — not literal FFmpeg encoder-binary names. A profile's
        `name` can be passed straight to `POST /encode`'s `profile`
        field.
      tags:
        - Encoding
      responses:
        "200":
          description: "The real set of built-in and user-created profiles."
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  count:
                    type: integer
                    description: Number of profiles returned.
        "401":
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Real and correctly implemented. `Authorization: Bearer <apiKey>`
        is required on every route except `OPTIONS` preflight requests.
        The token is compared with `==` (not constant-time) against the
        `apiKey` the server was started with — either generated
        automatically by `meedya-convert serve` (and printed once to
        stderr) or supplied explicitly via `--api-key`. A missing
        header, a non-"Bearer " prefix, or a mismatched token all
        produce the same `401`.

  responses:
    Unauthorized:
      description: "Real behaviour — missing or invalid bearer token."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            message: Invalid or missing bearer token

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    ProbeExistenceResponse:
      type: object
      description: "The 404 response shape from POST /probe, returned when the given path does not exist on disk."
      properties:
        path:
          type: string
          description: Echoed back verbatim from the request.
        exists:
          type: boolean
          enum: [false]
        status:
          type: string
          enum: [file_not_found]

    ProbeResult:
      type: object
      description: "The 200 response shape from POST /probe — real media metadata from EncodingEngine.probe(url:) (FFprobe)."
      properties:
        path:
          type: string
          description: Echoed back verbatim from the request.
        exists:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [ready]
        durationSeconds:
          type: number
          description: "`mediaFile.duration`, or 0 if FFprobe could not determine it."
        container:
          type: string
          description: "`mediaFile.containerFormatName` (raw ffprobe container name), or an empty string if unknown."
        videoStreamCount:
          type: integer
        audioStreamCount:
          type: integer
        subtitleStreamCount:
          type: integer
        hasHDR:
          type: boolean

    ProbeFailedResponse:
      type: object
      description: "The 503 response shape from POST /probe, returned when the file exists but the real prober threw."
      properties:
        path:
          type: string
          description: Echoed back verbatim from the request.
        exists:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [probe_failed]
        message:
          type: string
          description: "`error.localizedDescription` from the thrown error."

    QueueJob:
      type: object
      description: "One job as returned by GET /queue, mapped from a real `EncodingJob` via `engine.queue.jobsSnapshot()`."
      properties:
        jobId:
          type: string
          format: uuid
        input:
          type: string
          description: Source file path (`job.config.inputURL.path`).
        output:
          type: string
          description: Destination file path (`job.config.outputURL.path`).
        profile:
          type: string
          description: Name of the profile attached to the job.
        status:
          type: string
          enum: [queued, encoding, paused, completed, failed, cancelled]
          description: >-
            The full `EncodingJobStatus` raw-value set
            (Sources/ConverterEngine/Encoding/EncodingJob.swift) — a job
            cancelled via `EncodingQueue.cancelJob(id:)` (e.g. from the GUI,
            if the injected engine is the app's live one) stays in the
            queue with this status until something calls `clearFinished()`,
            so it can appear here. There is no `DELETE`/cancel route on
            this HTTP API itself.
        progress:
          type: number
          description: "Real-time progress fraction (`job.progress`), 0.0–1.0."

    Profile:
      type: object
      description: "One encoding profile as returned by GET /profiles, mapped from a real `EncodingProfile` via `engine.profileStore.allProfiles()`."
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [quick_start, streaming, disc, archival, custom]
        isBuiltIn:
          type: boolean
          description: "`true` for the shipped built-in profiles, `false` for user-created ones."
        videoCodec:
          type: string
          description: "`VideoCodec` enum raw value (e.g. \"h264\", \"h265\"), or an empty string if the profile has no fixed video codec."
        audioCodec:
          type: string
          description: "`AudioCodec` enum raw value (e.g. \"aac\"), or an empty string if the profile has no fixed audio codec."
        containerFormat:
          type: string
          description: "`ContainerFormat` enum raw value (e.g. \"mp4\", \"mkv\")."

    NotFound:
      type: object
      description: "Returned for any method/path combination not in the five routes above (e.g. GET /encode, POST /status, DELETE anything)."
      properties:
        error:
          type: string
          enum: ["Not Found"]
        message:
          type: string
