# ============================================================================
# MeedyaConverter CLI API — OpenAPI Specification
# Copyright © 2026 MWBM Partners Ltd. All rights reserved.
#
# This document describes the meedya-convert CLI tool's command structure,
# arguments, options, and JSON schemas in OpenAPI-compatible format.
# Each CLI subcommand is represented as a "path", with options modelled
# as parameters and output schemas documented as responses.
#
# CLI exit codes are documented in the ExitCodes schema. HTTP status codes
# used in responses are mapped as follows:
#   200 = exit 0 (success)
#   400 = exit 2 (invalid arguments)
#   404 = exit 3 (input not found)
#   409 = exit 5 (output write error)
#   422 = exit 6 (validation failed)
#   500 = exit 1 (general error)
#   502 = exit 4 (encoding failed / FFmpeg error)
#
# Accuracy notes (read before relying on this document):
#   - Every parameter, enum, default, and schema below was checked directly
#     against Sources/meedya-convert/**/*.swift and the ConverterEngine
#     types they reference (VideoCodec, AudioCodec, ContainerFormat,
#     EncodingProfile, MediaFile, MediaStream, StreamingVariant,
#     EncodingJobConfig) as of the "Updated" date below.
#   - As of PR #472 (#466/#484/#489/#490, 2026-08-04), `encode`'s
#     `--video-codec`/`--audio-codec`/`--container` and `manifest`'s
#     `--video-codec`/`--audio-codec` VALIDATE their input and throw a
#     `ValidationError` listing the accepted values for anything
#     unrecognised — this is a behaviour change from the previously
#     silent-fallback behaviour this document used to describe (see
#     "Known CLI quirks" below for exactly what changed and what remains
#     true on the still-permissive options, e.g. `--tonemap-algorithm`,
#     `--crf`, `--preset`). `@Option` help strings still list only a
#     handful of *example* values (e.g. "--video-codec (h264, h265, av1,
#     prores, vp9, copy)") rather than the full accepted set — this
#     document lists the full set from the `RawRepresentable` enums in
#     `components/schemas`, plus the now-accepted `copy` value.
#   - JSON emitted via `JSONEncoder` (probe --format json, profiles
#     --json/--show/--export) uses Swift's synthesised `Encodable`
#     conformance: `Optional` properties that are `nil` are OMITTED from
#     the object entirely (not encoded as `null`). Treat every field not
#     marked `required` below as "may be absent", not "may be null".
#   - JSON consumed via `JSONDecoder` (batch --job-file, --ladder-file,
#     profiles --import, validate --profile-file/--manifest) uses
#     Swift's synthesised `Decodable` conformance: a stored property's
#     Swift-side default value (e.g. `audioChannels: Int = 2` in an
#     `init`) does NOT make that key optional in the JSON — only
#     properties whose *type* is `Optional` may be omitted. This trips up
#     hand-written job/ladder files; the `required` lists below reflect
#     the real decode requirements, not the friendlier `init` defaults.
#
# Updated: 2026-08-04 — re-verified against Sources/meedya-convert/** on
# branch wip/alpha-consolidation (PR #472, draft — landing in the next
# alpha build, NOT in the released v0.1.0-rc.3). Since the 2026-07-28 pass,
# five CLI-contract-changing fixes landed:
#   - #466: encode --video-codec/--audio-codec/--container now REJECT
#     unrecognised values (ValidationError) instead of silently dropping
#     them; `copy` is now an accepted --video-codec/--audio-codec value,
#     routed to the existing passthrough flags.
#   - #484: batch --job-file now exits 4 (encodingFailed) if any job
#     failed, instead of always exiting 0.
#   - #489: profiles --show/--export/--validate and validate --profile now
#     resolve against the persisted profile store (not just built-ins);
#     profiles --list now sources EncodingProfileStore().allProfiles().
#   - #490: manifest --hdr now REJECTED (ValidationError — HDR signalling
#     is not implemented in the manifest encode path); manifest
#     --video-codec/--audio-codec now validate like encode's flags instead
#     of silently defaulting to h264/aac; --variants custom now requires
#     --ladder-file.
# See the "Known CLI quirks" section and each path's parameter
# descriptions below for the corrected per-flag detail.
#
# Updated: 2026-09-02 — spot-checked every path's parameters against the
# current `@Option`/`@Flag` declarations in Sources/meedya-convert/Commands/
# and the enums under components/schemas against their ConverterEngine
# sources; `/serve` (added 2026-09-01, #497) confirmed still accurate.
# Two drifts found and fixed:
#   - `info.description` still said "six subcommands" — stale since #497
#     added `/serve` as a seventh path in this same document without
#     updating this count. Corrected to seven.
#   - The `/validate` path's `--profile` parameter description still said
#     it "searches EncodingProfile.builtInProfiles only, not user-saved
#     profiles" — stale since #489 (noted correctly in the changelog above,
#     just not carried into that parameter's own description).
#     `ValidateCommand.validateNamedProfile` resolves built-ins first, then
#     `EncodingProfileStore().profile(named:)`, same as `--profile-file`'s
#     siblings; corrected to match.
# ============================================================================

openapi: 3.1.0
info:
  title: meedya-convert CLI API
  version: 0.1.0-alpha
  description: |
    Command-line interface for MeedyaConverter media conversion toolkit.

    `meedya-convert` is a headless CLI tool built with Swift Argument Parser.
    It provides seven subcommands: encode, probe, profiles, batch, manifest,
    validate, and serve. Designed for CI/CD pipelines, batch processing,
    shell scripting, and remote encoding over SSH.

    **Root command:**
    ```
    meedya-convert <subcommand> [options]
    ```

    **Global flags:**
    - `--version` — Print the version string and exit.
    - `--help` / `-h` — Print usage information and exit.

    **Known CLI quirks (verified against source, not just --help text):**
    - `encode --video-codec <value>` and `encode --audio-codec <value>`
      accept a `VideoCodec` / `AudioCodec` raw value (see the enums under
      `components/schemas`), NOT just the 5-6 example values shown in the
      CLI's own `--help` output. **As of #466**, `copy` IS now a valid
      value for both — it does not correspond to an enum case, it is
      special-cased in `applyOverrides(to:)` to set
      `videoPassthrough`/`audioPassthrough` instead (equivalent to
      passing `--video-passthrough` / `--audio-passthrough`).
    - **As of #466** (previously the opposite — see below), if the string
      passed to `--video-codec` / `--audio-codec` / `--container` does not
      match `copy` (codec flags only) or any enum raw value (or, for
      `--container`, a resolvable file extension via
      `ContainerFormat.from(fileExtension:)`), `applyOverrides(to:)` now
      throws a `ValidationError` listing every accepted value, and the
      command exits without encoding anything. Previously (pre-#466) an
      unrecognised `--video-codec`/`--audio-codec` was silently dropped —
      `EncodeCommand` set the profile's codec to `nil`, and
      `FFmpegArgumentBuilder` emitted `-vn`/`-an` for that stream, so a
      typo produced an audio-only (or video-only) output file with exit
      0 and no error message; an unrecognised `--container` silently kept
      the profile's existing container. Neither happens anymore.
    - Selecting a `VideoCodec` that has no working FFmpeg software
      encoder (`h266`, `av2`, `cineform`, `vc1`, `mv_hevc`, `mv_h264` —
      i.e. `isEncoderStable == false`) still does not fail: this is
      unrelated to #466's rejection of *unrecognised* strings — a
      recognised-but-unsupported codec still passes validation, and the
      builder falls back to `libx264` (H.264) silently when not using
      hardware encoding.
    - `encode --tonemap-algorithm` is validated against
      `FFmpegArgumentBuilder.ToneMapAlgorithm`, whose cases are `hable`,
      `reinhard`, `mobius`, `bt2390`, `clip` — but `EncodeCommand`'s own
      `--help` text advertises `linear` as a valid value. `linear` does
      not match any case, so passing it silently falls back to the
      default (`hable`) with no warning. This was NOT touched by #466
      (that fix only covers `--video-codec`/`--audio-codec`/`--container`).
    - `encode --crf` and `encode --audio-channels` are NOT range/value
      checked by `encode` itself — any integer is accepted and passed
      through. Only `meedya-convert validate` flags an out-of-range CRF
      (outside 0-63) as a warning.
    - **As of #490**, `manifest --video-codec`/`--audio-codec` are now
      validated exactly like `encode`'s equivalent flags — an
      unrecognised value throws a `ValidationError` listing the accepted
      set. Previously (pre-#490) they were resolved as
      `VideoCodec(rawValue:) ?? .h264` / `AudioCodec(rawValue:) ?? .aacLC`,
      so a typo silently fell back to h264/aac with no warning; this
      fallback is gone. `manifest` still has no `copy`/passthrough
      concept at all (every variant is always re-encoded).
    - **As of #490**, `manifest --hdr` is now REJECTED outright — passing
      it throws `ValidationError("--hdr is not yet supported for
      manifest generation.")` before FFmpeg is even located.
      `ManifestGenerator.buildVariantArguments` never reads
      `config.preserveHDR`; there is no HDR colour-signalling
      implementation in the manifest encode path (unlike the main
      `encode` pipeline's `FFmpegArgumentBuilder`), so accepting the flag
      would silently do nothing. Previously (pre-#490) `--hdr` was
      accepted and silently ignored.
    - **As of #490**, `manifest --variants custom` now requires
      `--ladder-file` — `validate()` throws a `ValidationError` if
      `custom` is passed without one. Previously `"custom"` silently fell
      through to `StreamingVariant.defaultLadder` (see `resolveVariants`,
      which only branches on `4k`/`uhd`; every other string, including
      `custom` and typos, hits the `default:` case). This did not change:
      `--ladder-file` still always overrides `--variants` when both are
      given, and `4k`/`uhd` are still the only two preset strings that
      change behaviour.
    - **As of #489**, `profiles --show`/`--export`/`--validate` and
      `validate --profile` now resolve a name against
      `EncodingProfile.builtInProfiles` FIRST, then
      `EncodingProfileStore().profile(named:)` — the same order
      `encode --profile` already used — so a profile imported via
      `profiles --import` is now found by these commands too. `profiles`
      with no selection flags (or `--list`) now sources
      `EncodingProfileStore().allProfiles()` (built-ins + persisted user
      profiles, de-duplicated by the store) instead of only
      `EncodingProfile.builtInProfiles`. Previously (pre-#489) all four
      of these searched built-ins only, so a just-imported profile was
      reported "not found" by the very tool that imported it.
    - **As of #484**, `batch --job-file` now exits 4
      (`ExitCodes.encodingFailed`) if any job in the file failed,
      matching `batch --dir`'s pre-existing behaviour exactly (both now
      track a failure count across the loop — still processing every
      job — and throw `ExitCode(ExitCodes.encodingFailed.rawValue)` if
      the count is nonzero). Previously (pre-#484) `--job-file` mode
      logged each failure to stderr but always exited 0 regardless, even
      if every job failed — breaking the documented CI/CD exit-code
      contract its sibling mode already honoured.
  contact:
    name: MWBM Partners Ltd
    url: https://github.com/MWBMPartners/MeedyaConverter
  license:
    name: Proprietary
    url: https://github.com/MWBMPartners/MeedyaConverter/blob/main/LICENSE

servers:
  - url: cli://meedya-convert
    description: Local CLI executable

# ============================================================================
# CLI commands documented as "paths"
# ============================================================================
paths:

  # --------------------------------------------------------------------------
  # encode — Transcode a single media file
  # --------------------------------------------------------------------------
  /encode:
    post:
      operationId: encode
      summary: Transcode a media file using a named profile or custom settings.
      description: |
        Convert a single media file to a different codec, container, resolution,
        or quality setting. Supports per-stream codec selection, HDR tone
        mapping, hardware encoding, and passthrough (remux) modes.

        **Usage:**
        ```
        meedya-convert encode --input <path> [--output <path>] [options]
        ```

        If `--output` is omitted, the output file is placed in the same
        directory as the input with a `_converted` suffix and an extension
        matching the selected profile or container. The generated filename
        component is passed through `PathSanitizer` (#432 / F-002).

        `--profile` is resolved first against the 24 built-in profiles
        (`EncodingProfile.builtInProfiles`), then against the user's saved
        profile store (`~/Library/Application Support/MeedyaConverter/Profiles/user_profiles.json`
        on macOS) by case-insensitive name match. Any of the video/audio/
        container flags below then override individual fields of whichever
        profile was resolved (or of `EncodingProfile.quickConvert` if
        `--profile` was omitted).

        **Exit codes:** 0 (success), 2 (invalid arguments — unrecognised
        `--video-codec`/`--audio-codec`/`--container` value, or a
        mutually-exclusive flag combination such as `--video-passthrough`
        with `--video-codec`; thrown as a `ValidationError`, #466), 4
        (encoding failed), 5 (output write error).
      tags:
        - Encoding
      parameters:
        # -- Required --
        - name: --input / -i
          in: query
          required: true
          description: Path to the input media file. The file must exist (checked in `validate()` before `run()`).
          schema:
            type: string

        # -- Output --
        - name: --output / -o
          in: query
          required: false
          description: "Path to the output file. Defaults to input directory with profile-based extension and `_converted` suffix (e.g. `movie_converted.mkv`)."
          schema:
            type: string

        # -- Profile --
        - name: --profile / -p
          in: query
          required: false
          description: Name or ID of a built-in or user-saved encoding profile to use, matched case-insensitively. Profile settings can be overridden by subsequent flags. Defaults to the "Quick Convert" built-in profile when omitted.
          schema:
            type: string

        # -- Video Options --
        - name: --video-codec
          in: query
          required: false
          description: |
            Video codec for re-encoding. Any `VideoCodec` raw value is
            accepted (see `#/components/schemas/VideoCodec`), PLUS the
            literal string `copy` (as of #466) — `copy` is not a
            `VideoCodec` case; `applyOverrides(to:)` special-cases it to
            set `videoPassthrough = true` instead, equivalent to passing
            `--video-passthrough`. Any other unrecognised value now
            throws a `ValidationError` listing the accepted set
            (`copy` + every `VideoCodec` raw value) and the command exits
            2 without encoding — this is a change from the pre-#466
            behaviour, where an unrecognised value silently disabled the
            video stream (`-vn`) with no error and exit 0.
          schema:
            $ref: '#/components/schemas/VideoCodec'

        - name: --crf
          in: query
          required: false
          description: "Constant Rate Factor (quality). Lower values produce higher quality and larger files. NOT range-checked by `encode` itself — any integer is accepted and forwarded to FFmpeg as-is. `meedya-convert validate` separately warns if the value is outside 0-63."
          schema:
            type: integer

        - name: --video-bitrate
          in: query
          required: false
          description: "Target video bitrate. Accepts suffixes: k (kilobits), M (megabits), or a plain integer (bits/sec). Examples: 5000k, 10M."
          schema:
            type: string
            examples:
              - "5000k"
              - "10M"

        - name: --preset
          in: query
          required: false
          description: |
            Encoder speed/quality preset, passed through unvalidated to
            the selected encoder via `-preset`. There is no fixed enum in
            the code — valid values depend entirely on which encoder
            `--video-codec` selects: libx264/libx265 accept
            `ultrafast`..`veryslow`; SVT-AV1 (`libsvtav1`, used for
            `av1`) accepts a numeric string `0`-`13` (see the built-in
            `Web Next-Gen` profile, which uses `"6"`); `prores_ks`
            accepts quality-tier names like `proxy`, `lt`, `hq`, `4444`.
            The CLI's own `--help` text lists only
            `ultrafast, fast, medium, slow, veryslow` as examples.
          schema:
            type: string
            examples:
              - "medium"
              - "veryslow"
              - "6"
              - "hq"

        - name: --resolution
          in: query
          required: false
          description: "Output resolution as WIDTHxHEIGHT. Example: 1920x1080, 3840x2160. Parsed case-insensitively; a malformed value is silently ignored (resolution left unchanged) rather than raising an error."
          schema:
            type: string
            pattern: "^\\d+x\\d+$"
            examples:
              - "1920x1080"
              - "1280x720"

        - name: --video-passthrough
          in: query
          required: false
          description: Copy the video stream without re-encoding (passthrough/remux). Rejected by `validate()` if combined with `--video-codec`.
          schema:
            type: boolean
            default: false

        # -- Audio Options --
        - name: --audio-codec
          in: query
          required: false
          description: |
            Audio codec for re-encoding. Any `AudioCodec` raw value is
            accepted (see `#/components/schemas/AudioCodec`), PLUS the
            literal string `copy` (as of #466) — `copy` is not an
            `AudioCodec` case; `applyOverrides(to:)` special-cases it to
            set `audioPassthrough = true` instead, equivalent to passing
            `--audio-passthrough`. Any other unrecognised value now
            throws a `ValidationError` listing the accepted set
            (`copy` + every `AudioCodec` raw value) and the command exits
            2 without encoding — this is a change from the pre-#466
            behaviour, where an unrecognised value silently disabled the
            audio stream (`-an`) with no error and exit 0.
          schema:
            $ref: '#/components/schemas/AudioCodec'

        - name: --audio-bitrate
          in: query
          required: false
          description: "Target audio bitrate. Examples: 128k, 256k, 640k."
          schema:
            type: string
            examples:
              - "128k"
              - "256k"

        - name: --audio-channels
          in: query
          required: false
          description: "Audio channel count. NOT range/value-checked by `encode` itself — any integer is accepted and forwarded as `-ac`. The CLI's `--help` text suggests 1/2/6/8 as examples (mono/stereo/5.1/7.1) but does not enforce them."
          schema:
            type: integer

        - name: --audio-passthrough
          in: query
          required: false
          description: Copy the audio stream without re-encoding. Rejected by `validate()` if combined with `--audio-codec`.
          schema:
            type: boolean
            default: false

        # -- Subtitle Options --
        - name: --subtitle-passthrough
          in: query
          required: false
          description: Copy subtitle streams to the output file.
          schema:
            type: boolean
            default: false

        - name: --no-subtitles
          in: query
          required: false
          description: "Exclude all subtitle streams from the output. Implemented by setting `subtitlePassthrough = false`; combining this with `--subtitle-passthrough` is not rejected — whichever flag's override runs last in `applyOverrides` wins (`--no-subtitles` is applied after `--subtitle-passthrough`, so together they resolve to no subtitles)."
          schema:
            type: boolean
            default: false

        # -- Container --
        - name: --container
          in: query
          required: false
          description: "Output container format. Accepts any `ContainerFormat` raw value (see `#/components/schemas/ContainerFormat`) OR a bare file extension resolved via `ContainerFormat.from(fileExtension:)` (e.g. `mpg`, `mpeg`, `vob`, `mts`, `m2ts`, `aif`, `ogv`). Overrides the profile's default container. The CLI's `--help` text lists only 5 examples. As of #466, a value matching neither now throws a `ValidationError` listing every accepted `ContainerFormat` raw value and the command exits 2 — previously it silently left the profile's existing container unchanged."
          schema:
            $ref: '#/components/schemas/ContainerFormat'

        # -- HDR Options --
        - name: --tonemap
          in: query
          required: false
          description: Enable HDR-to-SDR tone mapping. Rejected by `validate()` if combined with `--pq-to-hlg`.
          schema:
            type: boolean
            default: false

        - name: --tonemap-algorithm
          in: query
          required: false
          description: |
            Tone mapping algorithm used when `--tonemap` is enabled.
            Validated against `FFmpegArgumentBuilder.ToneMapAlgorithm`
            (`hable`, `reinhard`, `mobius`, `bt2390`, `clip`). The CLI's
            own `--help` text advertises `linear` instead of `clip` —
            passing `linear` does not match any case and silently falls
            back to the default, `hable`.
          schema:
            $ref: '#/components/schemas/ToneMapAlgorithm'
            default: hable

        - name: --pq-to-hlg
          in: query
          required: false
          description: Convert PQ (HDR10) transfer function to HLG. Rejected by `validate()` if combined with `--tonemap`.
          schema:
            type: boolean
            default: false

        - name: --pq-to-dv-hlg
          in: query
          required: false
          description: Convert PQ to Dolby Vision Profile 8.4 + HLG combined output.
          schema:
            type: boolean
            default: false

        # -- Metadata --
        - name: --no-copy-metadata
          in: query
          required: false
          description: "Do not copy source metadata (tags, titles) to the output file. Implemented by appending `-map_metadata -1` to the job's extra FFmpeg arguments."
          schema:
            type: boolean
            default: false

        - name: --no-copy-chapters
          in: query
          required: false
          description: "Do not copy chapter markers to the output file. Implemented by appending `-map_chapters -1` to the job's extra FFmpeg arguments."
          schema:
            type: boolean
            default: false

        # -- Stream Selection --
        - name: --video-stream
          in: query
          required: false
          description: Index of the video stream to encode (default is the first video stream).
          schema:
            type: integer

        - name: --audio-stream
          in: query
          required: false
          description: Index of the audio stream to encode (default is the first audio stream).
          schema:
            type: integer

        - name: --subtitle-stream
          in: query
          required: false
          description: Index of the subtitle stream to include in the output.
          schema:
            type: integer

        - name: --map-all
          in: query
          required: false
          description: Map all streams from the source file to the output.
          schema:
            type: boolean
            default: false

        # -- Hardware Encoding --
        - name: --hardware
          in: query
          required: false
          description: "Use hardware encoder if available. On macOS, applies only to codecs where `VideoCodec.supportsVideoToolbox` is true (h264, h265, prores, mv_hevc, av1 on Apple M3+); other codecs fall back to software encoding regardless of this flag."
          schema:
            type: boolean
            default: false

        # -- Output Control --
        - name: --quiet
          in: query
          required: false
          description: Suppress progress output to stderr.
          schema:
            type: boolean
            default: false

        - name: --json
          in: query
          required: false
          description: "Emit progress as one-line JSON objects (`{\"progress\":<0-100>}`) to stderr during encoding, and the final `EncodeResult` as pretty-printed JSON to stdout on completion. Has no effect when `--quiet` is also set (no progress is printed either way)."
          schema:
            type: boolean
            default: false

        - name: --yes / -y
          in: query
          required: false
          description: Overwrite the output file without prompting if it already exists. Without this flag, `encode` exits with code 5 if the output path already exists (there is no interactive prompt — the CLI never blocks on stdin here).
          schema:
            type: boolean
            default: false

      responses:
        "200":
          description: "Exit 0 — Encoding completed successfully. `EncodeResult` JSON is only printed to stdout when `--json` was passed; otherwise a human-readable summary line is printed to stderr."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResult'
        "400":
          description: "Exit 2 — Invalid arguments: an unrecognised `--video-codec`/`--audio-codec`/`--container` value (#466), or a rejected flag combination (`--video-passthrough` + `--video-codec`, `--audio-passthrough` + `--audio-codec`, `--tonemap` + `--pq-to-hlg`)."
        "502":
          description: "Exit 4 — Encoding failed (FFmpeg error)."
        "409":
          description: "Exit 5 — Output write error (file exists without --yes, permissions, disk full)."

  # --------------------------------------------------------------------------
  # probe — Inspect a media file
  # --------------------------------------------------------------------------
  /probe:
    get:
      operationId: probe
      summary: Inspect a media file and print its metadata.
      description: |
        Analyse a media file using FFprobe and display detailed information
        about its streams (video, audio, subtitle), container, metadata,
        chapters, and HDR properties.

        **Usage:**
        ```
        meedya-convert probe --input <path> [--format text|json] [options]
        ```

        **Exit codes:** 0 (success), 4 (probe failed).
      tags:
        - Inspection
      parameters:
        - name: --input / -i
          in: query
          required: true
          description: Path to the media file to inspect. The file must exist.
          schema:
            type: string

        - name: --format / -f
          in: query
          required: false
          description: "Output format."
          schema:
            type: string
            enum: [text, json]
            default: text

        - name: --streams-only
          in: query
          required: false
          description: "Show only stream information (skip file-level details and metadata). Text output only — has no effect on `--format json`, which always emits the full `MediaFile` object."
          schema:
            type: boolean
            default: false

        - name: --hdr
          in: query
          required: false
          description: "Show detailed HDR metadata (colour primaries, transfer characteristics, MaxCLL, MaxFALL, mastering display) per video stream. Text output only — `--format json` always includes `colourProperties` when present regardless of this flag."
          schema:
            type: boolean
            default: false

      responses:
        "200":
          description: "Exit 0 — Probe completed successfully."
          content:
            text/plain:
              schema:
                type: string
                description: Human-readable media file information.
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFile'
        "502":
          description: "Exit 4 — Probe failed (FFprobe error or unreadable file)."

  # --------------------------------------------------------------------------
  # profiles — List, show, export, import, and validate encoding profiles
  # --------------------------------------------------------------------------
  /profiles:
    get:
      operationId: profiles
      summary: List, show, export, import, or validate encoding profiles.
      description: |
        Manage encoding profiles. By default (with no flags or with --list),
        lists all available profiles (built-in + persisted user profiles)
        grouped by category.

        **Usage:**
        ```
        meedya-convert profiles [--list] [--show <name>] [--export <name>]
                                [--import <file>] [--validate <name>]
                                [--platform <name>] [--json]
        ```

        Precedence when multiple selection flags are given: `--export`
        wins over `--import`, which wins over `--validate`, which wins
        over `--show`; `--list` (or no flags) only runs if none of the
        others are set. `--platform` only has an effect together with
        `--validate`; combined with any other flag it is silently
        ignored.

        **As of #489**, name resolution for `--show`/`--export`/
        `--validate` (and `--list`'s profile source) now includes the
        persisted user profile store, not just built-ins — see the
        `--show` parameter description below for the exact lookup order.
        Previously (pre-#489) all four searched
        `EncodingProfile.builtInProfiles` only, so a profile just
        imported via `profiles --import` was reported "not found" by the
        same tool that had just imported it.

        **Exit codes:** 0 (success), 2 (profile not found / invalid arguments).
      tags:
        - Profiles
      parameters:
        - name: --list
          in: query
          required: false
          description: "List all available encoding profiles (default action; this flag is not actually read by `run()` — omitting all other selection flags does the same thing). As of #489, sources `EncodingProfileStore().allProfiles()` (built-ins + persisted user profiles, de-duplicated by the store, matching APIServer's GET /profiles) — previously (pre-#489) this listed `EncodingProfile.builtInProfiles` only."
          schema:
            type: boolean
            default: false

        - name: --show
          in: query
          required: false
          description: "Show detailed settings of a named profile. As of #489, resolved case-insensitively against `EncodingProfile.builtInProfiles` FIRST, then `EncodingProfileStore().profile(named:)` — the same order `encode --profile` uses — so a profile imported via `profiles --import` is now found. Previously (pre-#489) only built-ins were searched."
          schema:
            type: string

        - name: --export
          in: query
          required: false
          description: "Export a named profile to JSON (`EncodingProfile`, pretty-printed with sorted keys). Outputs to stdout unless `--export-file` is set. As of #489, resolved built-ins-first-then-store, same as `--show` above — previously built-ins only."
          schema:
            type: string

        - name: --export-file
          in: query
          required: false
          description: Output file path for profile export. If omitted, JSON is printed to stdout.
          schema:
            type: string

        - name: --import
          in: query
          required: false
          description: "Import a profile from a JSON file (decoded as `EncodingProfile` — see `#/components/schemas/EncodingProfile` for the full set of required keys). The imported profile is assigned a new UUID, forced to `category: custom` and `isBuiltIn: false`, and persisted to the user profile store."
          schema:
            type: string

        - name: --validate
          in: query
          required: false
          description: "Validate a named profile for codec/container compatibility issues. As of #489, resolved built-ins-first-then-store, same order/lookup as `--show` above — previously (pre-#489) searched `EncodingProfile.builtInProfiles` only, not user-saved profiles."
          schema:
            type: string

        - name: --platform
          in: query
          required: false
          description: "Target platform for compatibility check during validation, only used together with `--validate`."
          schema:
            $ref: '#/components/schemas/Platform'

        - name: --json
          in: query
          required: false
          description: Output as JSON instead of human-readable text.
          schema:
            type: boolean
            default: false

      responses:
        "200":
          description: "Exit 0 — Operation completed successfully."
        "400":
          description: "Exit 2 — Invalid arguments (profile not found)."

  # --------------------------------------------------------------------------
  # batch — Encode multiple files from a directory or job file
  # --------------------------------------------------------------------------
  /batch:
    post:
      operationId: batch
      summary: Encode multiple files from a directory or JSON job file.
      description: |
        Process multiple media files in one invocation. Supports two modes:

        1. **Directory mode** (`--dir`): Scan a directory for media files
           matching specified extensions and encode them all with a named
           profile (resolved the same way as `encode --profile`: built-in
           profiles first, then the user profile store). Requires `--profile`.

        2. **Job file mode** (`--job-file`): Load a JSON array of full
           `EncodingJobConfig` objects (see
           `#/components/schemas/EncodingJobConfig` — this is NOT a
           simplified input/output pair, every non-optional field of the
           real job struct is required) and encode each one. `--profile`,
           `--extension`, and `--recursive` have no effect in this mode.

        The two modes are mutually exclusive (enforced by `validate()`).

        **Exit codes:** 0 (all succeeded), 4 (one or more jobs failed —
        both modes; as of #484, job-file mode now exits 4 the same way
        directory mode always has, instead of always exiting 0. Both
        modes still process every job/file in the batch before exiting —
        a failure does not stop the run early).
      tags:
        - Batch
      parameters:
        - name: --dir
          in: query
          required: false
          description: Directory containing input files to encode. Mutually exclusive with --job-file.
          schema:
            type: string

        - name: --job-file
          in: query
          required: false
          description: Path to a JSON file containing an array of `EncodingJobConfig` objects. Mutually exclusive with --dir.
          schema:
            type: string

        - name: --profile / -p
          in: query
          required: false
          description: Encoding profile name. Required when using --dir; ignored with --job-file.
          schema:
            type: string

        - name: --output / -o
          in: query
          required: false
          description: "Output directory for encoded files (--dir mode only). Defaults to an `encoded/` subdirectory inside the input directory."
          schema:
            type: string

        - name: --extension
          in: query
          required: false
          description: "Comma-separated list of file extensions to include when scanning a directory (--dir mode only). Defaults to: mkv,mp4,avi,mov,webm,ts,m4v,flv,wmv,mpg."
          schema:
            type: string
            default: "mkv,mp4,avi,mov,webm,ts,m4v,flv,wmv,mpg"

        - name: --recursive
          in: query
          required: false
          description: Recursively scan subdirectories when using --dir.
          schema:
            type: boolean
            default: false

        - name: --quiet
          in: query
          required: false
          description: Suppress progress output to stderr.
          schema:
            type: boolean
            default: false

        - name: --json
          in: query
          required: false
          description: "Output a `BatchResult` summary as JSON (--dir mode only — job-file mode never emits a JSON summary, this flag only suppresses the per-file `Progress: NN%` text line in that mode)."
          schema:
            type: boolean
            default: false

        - name: --yes / -y
          in: query
          required: false
          description: Overwrite existing output files without prompting (--dir mode only; job-file mode has no overwrite check).
          schema:
            type: boolean
            default: false

      responses:
        "200":
          description: "Exit 0 — All jobs completed successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        "502":
          description: "Exit 4 — One or more jobs failed, in EITHER mode as of #484 (`runJobFileBatch` now tracks a failure count across the loop and throws `ExitCode(ExitCodes.encodingFailed.rawValue)` if it's nonzero, matching `runDirectoryBatch`'s pre-existing behaviour). Previously (pre-#484) job-file mode always exited 0 regardless of per-job failures."

  # --------------------------------------------------------------------------
  # manifest — Generate adaptive streaming manifests (HLS/DASH/CMAF)
  # --------------------------------------------------------------------------
  /manifest:
    post:
      operationId: manifest
      summary: Generate adaptive streaming manifests (HLS/DASH) with multi-bitrate variants.
      description: |
        Encode a source file into multiple quality variants and generate
        adaptive streaming manifests. Supports HLS (.m3u8), MPEG-DASH (.mpd),
        and CMAF (dual HLS + DASH manifests).

        **Usage:**
        ```
        meedya-convert manifest --input <path> --output <dir> [--format hls|dash|cmaf] [options]
        ```

        **Exit codes:** 0 (success), 1 (general error, e.g. FFmpeg
        unavailable), 2 (invalid arguments — `validate()` rejects, before
        FFmpeg is even located: a `--format` other than hls/dash/cmaf; as
        of #490, `--hdr` unconditionally — see the `--hdr` parameter
        below; an unrecognised `--video-codec`/`--audio-codec`; and
        `--variants custom` without `--ladder-file`).
      tags:
        - Streaming
      parameters:
        - name: --input / -i
          in: query
          required: true
          description: Path to the source media file.
          schema:
            type: string

        - name: --output / -o
          in: query
          required: true
          description: Output directory for manifest files and media segments.
          schema:
            type: string

        - name: --format / -f
          in: query
          required: false
          description: "Manifest format. CMAF produces both HLS and DASH manifests. Validated (rejects anything else with exit code 2)."
          schema:
            type: string
            enum: [hls, dash, cmaf]
            default: hls

        - name: --video-codec
          in: query
          required: false
          description: "Video codec for all variants. Any `VideoCodec` raw value is accepted — NOT restricted to h264/h265/av1 as the flag's `--help` text implies. As of #490, `validate()` now guards this with `VideoCodec(rawValue:)` and throws a `ValidationError` listing the accepted values if unrecognised, mirroring `encode --video-codec`. There is no `copy`/passthrough concept for `manifest` (unlike `encode`) — every variant is always re-encoded. Previously (pre-#490) an unrecognised value was resolved as `VideoCodec(rawValue:) ?? .h264` and silently fell back to `h264` with no error."
          schema:
            type: string
            default: h264
            examples:
              - h264
              - h265
              - av1

        - name: --audio-codec
          in: query
          required: false
          description: "Audio codec for all variants. Any `AudioCodec` raw value is accepted. As of #490, `validate()` now guards this with `AudioCodec(rawValue:)` and throws a `ValidationError` listing the accepted values if unrecognised. Previously (pre-#490) an unrecognised value was resolved as `AudioCodec(rawValue:) ?? .aacLC` and silently fell back to `aac` with no error."
          schema:
            type: string
            default: aac
            examples:
              - aac
              - ac3
              - eac3
              - opus

        - name: --preset
          in: query
          required: false
          description: "Encoder speed/quality preset, passed through unvalidated to `-preset` (same caveats as `encode --preset` — meaning depends on the resolved video codec's encoder)."
          schema:
            type: string
            default: medium

        - name: --segment-duration
          in: query
          required: false
          description: Segment duration in seconds.
          schema:
            type: number
            format: double
            default: 6.0

        - name: --keyframe-interval
          in: query
          required: false
          description: "Keyframe interval in seconds for GOP alignment. The generator assumes a fixed 30fps when converting to a GOP frame count (`Int(keyframeInterval * 30)`) regardless of the source's actual frame rate."
          schema:
            type: number
            format: double
            default: 2.0

        - name: --variants
          in: query
          required: false
          description: |
            Variant ladder preset. Only two values change behaviour:
            `4k` or `uhd` (case-insensitive) select
            `StreamingVariant.uhdrLadder` (4 variants up to 2160p); every
            other string — including the default `default` — falls
            through to `StreamingVariant.defaultLadder` (4 variants up to
            1080p) UNLESS `--ladder-file` is also given, which overrides
            `--variants` entirely regardless of its value. There is still
            no `custom` case in `resolveVariants`'s switch — `custom` is
            just one more string that falls through to the default ladder
            when reached — but as of #490, `validate()` now special-cases
            it: `--variants custom` WITHOUT `--ladder-file` is rejected
            with a `ValidationError` before that fallthrough can happen.
            A typo other than the literal word `custom` (e.g. `defalut`)
            still silently falls through to the default ladder with no
            error. Previously (pre-#490) `--variants custom` alone
            silently produced the default ladder.
          schema:
            type: string
            default: default
            examples:
              - default
              - 4k
              - uhd

        - name: --ladder-file
          in: query
          required: false
          description: Path to a JSON file defining a custom variant ladder (array of `StreamingVariant` objects — see `#/components/schemas/StreamingVariant` for the full set of required keys). Overrides --variants. As of #490, this is now REQUIRED when `--variants custom` is passed (see the `--variants` description above).
          schema:
            type: string

        - name: --hdr
          in: query
          required: false
          description: "Preserve HDR metadata in output variants. As of #490, this flag is now REJECTED — passing it throws `ValidationError(\"--hdr is not yet supported for manifest generation.\")` in `validate()`, before FFmpeg is even located. `ManifestGenerator.buildVariantArguments` never reads `config.preserveHDR`; there is no mastering-display/MaxCLL side-data or 10-bit pixel-format HDR signalling in the manifest encode path, unlike the main `encode` pipeline's `FFmpegArgumentBuilder`. Previously (pre-#490) the flag was accepted and silently had no effect. `--pixel-format yuv420p10le` can still be set manually, but does not by itself reconstruct full HDR signalling."
          schema:
            type: boolean
            default: false

        - name: --pixel-format
          in: query
          required: false
          description: "Pixel format for output, passed through unvalidated to `-pix_fmt`. Example: yuv420p, yuv420p10le."
          schema:
            type: string

        - name: --hardware
          in: query
          required: false
          description: "Use hardware encoder if available. Only `h264` and `h265` get a VideoToolbox encoder name substituted (`h264_videotoolbox` / `hevc_videotoolbox`); every other codec silently continues to use its software encoder even with this flag set."
          schema:
            type: boolean
            default: false

        - name: --dry-run
          in: query
          required: false
          description: Show the FFmpeg commands that would be executed (printed to stdout) without running them.
          schema:
            type: boolean
            default: false

        - name: --quiet
          in: query
          required: false
          description: Suppress progress output.
          schema:
            type: boolean
            default: false

        - name: --json
          in: query
          required: false
          description: Output the final `ManifestResult` as JSON to stdout on completion.
          schema:
            type: boolean
            default: false

        - name: --yes / -y
          in: query
          required: false
          description: "Accepted for CLI parity with encode/batch, but `manifest` never checks for an existing output directory before writing into it — this flag currently has no effect on `manifest`'s behaviour."
          schema:
            type: boolean
            default: false

      responses:
        "200":
          description: "Exit 0 — Manifest generation completed successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResult'
        "500":
          description: "Exit 1 — General error (e.g., FFmpeg not available)."
        "400":
          description: "Exit 2 — Invalid arguments: a `--format` other than hls/dash/cmaf; `--hdr` passed at all; an unrecognised `--video-codec`/`--audio-codec`; or `--variants custom` without `--ladder-file` (all as of #490 except `--format`, which predates it)."

  # --------------------------------------------------------------------------
  # validate — Validate profiles, manifests, and platform compatibility
  # --------------------------------------------------------------------------
  /validate:
    get:
      operationId: validate
      summary: Validate encoding profiles, manifest configurations, and platform compatibility.
      description: |
        Check that encoding profiles and manifest configurations are valid
        without performing an encode. Detects codec/container incompatibilities,
        HDR setting conflicts, CRF range errors, and platform-specific issues.

        **Usage:**
        ```
        meedya-convert validate --profile <name> [--platform <name>] [--strict] [--json]
        meedya-convert validate --profile-file <path> [--platform <name>] [--strict] [--json]
        meedya-convert validate --manifest <path> [--json]
        ```

        All three of `--profile`, `--profile-file`, and `--manifest` may
        be combined in one invocation — results from each are concatenated
        into a single warnings/errors list. At least one is required.

        **Exit codes:** 0 (valid), 6 (errors found or warnings with --strict).
      tags:
        - Validation
      parameters:
        - name: --profile
          in: query
          required: false
          description: "Validate a named encoding profile. As of #489, resolved case-insensitively against `EncodingProfile.builtInProfiles` FIRST, then `EncodingProfileStore().profile(named:)` — the same order `encode --profile` and `profiles --show` use — so a profile imported via `profiles --import` is found here too. Previously (pre-#489) this searched `EncodingProfile.builtInProfiles` only."
          schema:
            type: string

        - name: --profile-file
          in: query
          required: false
          description: "Validate an encoding profile from a JSON file on disk, decoded as `EncodingProfile` (see `#/components/schemas/EncodingProfile` for required keys)."
          schema:
            type: string

        - name: --manifest
          in: query
          required: false
          description: "Validate a manifest configuration JSON file, decoded as `ManifestConfig` (see `#/components/schemas/ManifestConfig`). Checks variant ladder validity via `ManifestGenerator.validate(config:)`, plus additional checks: duplicate resolutions, more than 10 variants, and bitrate ordering not matching resolution ordering."
          schema:
            type: string

        - name: --platform
          in: query
          required: false
          description: "Target platform for compatibility check. Only applies to `--profile` / `--profile-file`, not `--manifest`."
          schema:
            $ref: '#/components/schemas/Platform'

        - name: --json
          in: query
          required: false
          description: Output validation results as JSON.
          schema:
            type: boolean
            default: false

        - name: --strict
          in: query
          required: false
          description: Treat warnings as errors. With --strict, any warning causes a non-zero exit code (6).
          schema:
            type: boolean
            default: false

      responses:
        "200":
          description: "Exit 0 — Validation passed with no errors (warnings may be present unless --strict)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        "422":
          description: "Exit 6 — Validation failed (errors found, or warnings with --strict)."

  /serve:
    post:
      operationId: serve
      summary: Run the REST API server for headless/remote encoding control.
      description: |
        Starts `APIServer` and blocks, exposing the HTTP API documented in
        `meedya-http-api.yaml` on the given port, backed by a real
        `EncodingEngine`. Implemented by `Sources/meedya-convert/Commands/ServeCommand.swift`
        and registered in the command tree at
        `Sources/meedya-convert/MeedyaConvert.swift`.

        **Usage:**
        ```
        meedya-convert serve [--port <n>] [--api-key <key>]
        ```

        **Authentication is mandatory.** `APIServer`'s bearer token is a
        required, non-optional initialiser argument — there is no
        unauthenticated mode. Every request must carry
        `Authorization: Bearer <api-key>`. If `--api-key` is omitted, a random
        one-time key is generated and printed **to stderr** at startup; it is
        never shown again, and the server cannot be reached without it.

        **Binding:** the listener accepts on all interfaces. `APIServer` has no
        host-binding option, so there is no way to restrict it to loopback from
        the CLI. Do not expose the port to an untrusted network.

        **Known limitation, surfaced honestly:** `POST /encode` enqueues jobs
        onto the real encoding queue but does **not** start the queue runner,
        and `serve` does not start one either — so encoding will not begin until
        something else drives the queue. This mirrors the desktop app's
        "Add to Queue" without "Start Queue".

        **Lifetime:** `APIServer.start()` binds the listener and returns
        immediately; connections are serviced on the server's own dispatch
        queue. The command then sleeps indefinitely to keep the process alive
        and exits on SIGINT (Ctrl+C). There is no graceful-shutdown signal
        handler, so `APIServer.stop()` is never called.

        **Exit codes:** does not return under normal operation. 1 if the
        listener fails to bind (for example, the port is already in use);
        2 for an invalid `--port` or an empty `--api-key`; 130 on Ctrl+C.
      tags:
        - Server
      parameters:
        - name: --port
          in: query
          required: false
          description: "TCP port to listen on. Validated to be within 1-65535; anything else is a usage error (exit 2)."
          schema:
            type: integer
            minimum: 1
            maximum: 65535
            default: 8484

        - name: --api-key
          in: query
          required: false
          description: "Bearer token clients must send as `Authorization: Bearer <key>`. Must not be empty or whitespace-only (exit 2). If omitted, a random UUID key is generated and printed once to stderr."
          schema:
            type: string

      responses:
        "200":
          description: "Server started. The process blocks until interrupted; the HTTP surface it exposes is documented in `meedya-http-api.yaml`."
        "400":
          description: "Exit 2 — invalid `--port` (outside 1-65535) or an empty `--api-key`."
        "500":
          description: "Exit 1 — the API server failed to start (for example, the port is already in use)."

  /disc-drives:
    get:
      operationId: discDrives
      summary: List optical drives cdrdao can see.
      description: |
        `meedya-convert disc drives [--format text|json]`. Lists the optical
        drives via `cdrdao scanbus`. Direct distribution only — the App Store
        sandbox has no raw-device access.
      tags:
        - Disc
      parameters:
        - name: --format
          in: query
          required: false
          description: "Output format: text (default) or json."
          schema: { type: string, enum: [text, json], default: text }
      responses:
        "200": { description: "Drives listed." }

  /disc-toc:
    get:
      operationId: discToc
      summary: Read and print a disc's table of contents.
      description: |
        `meedya-convert disc toc --device <dev> [--driver <d>] [--fast]
        [--format text|json] [-o <path>]`. Reads the TOC via cdrdao and parses
        it (tracks, ISRC, CD-Text, sessions, pre-gaps). Direct distribution only.
      tags:
        - Disc
      parameters:
        - name: --device
          in: query
          required: true
          description: "cdrdao --device string (e.g. /dev/sr0)."
          schema: { type: string }
        - name: --driver
          in: query
          required: false
          description: "cdrdao --driver value (e.g. generic-mmc); omit to autodetect."
          schema: { type: string }
        - name: --fast
          in: query
          required: false
          description: "Use --fast-toc (skips the deep ISRC/pregap scan)."
          schema: { type: boolean, default: false }
        - name: --output
          in: query
          required: false
          description: "Where to write the .toc (default: a temp file, deleted after parse). Short: -o."
          schema: { type: string }
        - name: --format
          in: query
          required: false
          schema: { type: string, enum: [text, json], default: text }
      responses:
        "200": { description: "TOC read and printed." }
        "404": { description: "Exit 3 — no disc / device unreadable." }

  /disc-image:
    post:
      operationId: discImage
      summary: Image a physical Audio CD into a verified BIN/CUE pair.
      description: |
        `meedya-convert disc image --device <dev> -o <base> [--image-format bin]
        [--driver <d>] [--speed <n>] [--paranoia 0-3] [--subchannel]
        [--skip-verify] [--overwrite]`. Reads a Red Book Audio CD via cdrdao and
        writes <base>.bin + <base>.cue, verified (byte-count + SHA-256).

        Scope: Red Book Audio CDs only — a disc with a data session is refused
        (exit 2) pointing at the mixed-mode phases (#108/#135). DRM: protected
        content is never circumvented; a disc whose copy would be non-functional
        because of DRM is detected and declined (exit 6) rather than imaged
        broken. Direct distribution only. Requires cdrdao on PATH until the
        Direct build bundles it (DR-0001).
      tags:
        - Disc
      parameters:
        - name: --device
          in: query
          required: true
          schema: { type: string }
        - name: --output
          in: query
          required: true
          description: "Base output path; .bin/.cue derived from it. Short: -o."
          schema: { type: string }
        - name: --image-format
          in: query
          required: false
          description: "Only 'bin' is supported; any other value is rejected."
          schema: { type: string, default: bin }
        - name: --driver
          in: query
          required: false
          schema: { type: string }
        - name: --speed
          in: query
          required: false
          description: "Read speed; effect on cdrdao read-cd is drive/build-dependent."
          schema: { type: integer }
        - name: --paranoia
          in: query
          required: false
          description: "Error-correction level 0-3 (default 3 = full)."
          schema: { type: integer, minimum: 0, maximum: 3, default: 3 }
        - name: --subchannel
          in: query
          required: false
          description: "Capture raw + subchannel (2448-byte) sectors."
          schema: { type: boolean, default: false }
        - name: --skip-verify
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: --overwrite
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200": { description: "BIN/CUE written and verified." }
        "400": { description: "Exit 2 — a data-session disc (mixed-mode not yet supported) or invalid arguments." }
        "422": { description: "Exit 6 — refused: the disc is DRM-protected and a working copy cannot be made without circumvention." }
        "500": { description: "Exit 4 — cdrdao failed or verification mismatch." }

# ============================================================================
# Schemas — JSON output formats and job file structures
# ============================================================================
components:
  schemas:

    # -- Encode result (--json output, JSONSerialization dictionary) --
    EncodeResult:
      type: object
      description: "JSON output produced by `encode --json` upon successful completion, printed to stdout. Built as a plain `[String: Any]` dictionary (not a synthesised `Encodable`), so all five keys are always present."
      properties:
        status:
          type: string
          enum: [completed]
        input:
          type: string
          description: Absolute path to the input file.
        output:
          type: string
          description: Absolute path to the output file.
        elapsed_seconds:
          type: number
          format: double
          description: Total encoding time in seconds.
        profile:
          type: string
          description: Name of the encoding profile used.

    # -- Batch result (--json output, --dir mode only) --
    BatchResult:
      type: object
      description: JSON summary produced by `batch --dir ... --json` after all jobs complete. NOT produced by `--job-file` mode.
      properties:
        total:
          type: integer
          description: Total number of files processed.
        completed:
          type: integer
          description: Number of files successfully encoded.
        failed:
          type: integer
          description: Number of files that failed to encode.
        skipped:
          type: integer
          description: Number of files skipped (output already exists, --yes not set).

    # -- Manifest result (--json output) --
    ManifestResult:
      type: object
      description: JSON output produced by `manifest --json` upon completion.
      properties:
        status:
          type: string
          enum: [completed]
        format:
          type: string
          description: "Manifest format: hls, dash, or cmaf."
        variants:
          type: integer
          description: Number of quality variants encoded.
        output:
          type: string
          description: Absolute path to the output directory.
        elapsed_seconds:
          type: number
          format: double
          description: Total generation time in seconds.

    # -- Validation result (--json output) --
    ValidationResult:
      type: object
      description: JSON output produced by `validate --json`.
      properties:
        valid:
          type: boolean
          description: True if no errors were found (and no warnings in --strict mode).
        errors:
          type: array
          items:
            type: string
          description: List of validation errors.
        warnings:
          type: array
          items:
            type: string
          description: List of validation warnings.

    # -- Probe output (--format json) --
    MediaFile:
      type: object
      description: |
        Media file information returned by `probe --format json`.
        Serialised by Swift's synthesised `Encodable` conformance for
        `MediaFile` — ONLY the struct's stored properties are emitted;
        computed convenience properties such as `fileName`,
        `fileSizeString`, `durationString`, `hasHDR`, `hasDolbyVision`,
        `hasPQ`, `hasHLG`, `videoStreams`/`audioStreams`/`subtitleStreams`,
        and `summaryString` do NOT appear in the JSON at all (derive them
        client-side from `fileURL`, `fileSize`, `duration`, and `streams`).
        `id` is a random UUID assigned at probe time, not stable across
        repeated probes of the same file.
      required:
        - id
        - fileURL
        - streams
        - metadata
        - chapters
      properties:
        id:
          type: string
          format: uuid
        fileURL:
          type: string
          format: uri
          description: "file:// URL of the probed path."
        fileSize:
          type: integer
          description: File size in bytes (UInt64). Absent if unknown.
        containerFormat:
          $ref: '#/components/schemas/ContainerFormat'
        containerFormatName:
          type: string
          description: "Raw container name as reported by ffprobe (e.g. \"matroska,webm\"). Absent if unknown."
        streams:
          type: array
          items:
            $ref: '#/components/schemas/MediaStream'
        duration:
          type: number
          format: double
          description: Total duration in seconds. Absent if unknown.
        overallBitrate:
          type: integer
          description: Overall bitrate in bits per second. Absent if unknown.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: File-level metadata tags (title, artist, date, etc.). Always present, may be an empty object.
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
          description: Always present, may be an empty array.
        probedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp (encoder uses `.iso8601` date strategy). Absent unless the caller set it explicitly.
        probeVersions:
          type: object
          additionalProperties:
            type: string
          description: Probe tool version fingerprint, used for cache invalidation. Absent unless set.

    MediaStream:
      type: object
      description: |
        A single stream (video, audio, subtitle, or data), as serialised
        by Swift's synthesised `Encodable` conformance. Computed
        convenience properties (`resolutionString`, `isLosslessAudio`,
        `isSpatialAudio`, `summaryString`) do NOT appear in the JSON —
        derive `resolutionString` client-side from `width`/`height`.
        The field is named `streamType`, not `codecType`.
      required:
        - id
        - streamIndex
        - streamType
        - isDefault
        - isForced
        - isEnabled
        - hdrFormats
        - isStereo3D
      properties:
        id:
          type: string
          format: uuid
        streamIndex:
          type: integer
          description: 0-based index within the source file.
        streamType:
          type: string
          enum: [video, audio, subtitle, data, attachment, unknown]
        codecName:
          type: string
          description: Short codec name as reported by the probe tool. Absent if unknown.
        codecLongName:
          type: string
          description: Long/descriptive codec name. Absent if unknown.
        bitrate:
          type: integer
          description: Stream bitrate in bits per second. Absent if unknown or VBR without an average.
        duration:
          type: number
          format: double
          description: Stream duration in seconds (may differ from file duration). Absent if unknown.
        language:
          type: string
          description: BCP 47 language code. Absent if unknown.
        title:
          type: string
          description: User-facing stream label. Absent if unset.
        isDefault:
          type: boolean
        isForced:
          type: boolean
        isEnabled:
          type: boolean
        width:
          type: integer
          description: Video width in pixels. Video streams only.
        height:
          type: integer
          description: Video height in pixels. Video streams only.
        frameRate:
          type: number
          format: double
          description: Frames per second. Video streams only.
        pixelAspectRatio:
          type: string
        displayAspectRatio:
          type: string
        hdrFormats:
          type: array
          items:
            $ref: '#/components/schemas/HDRFormat'
          description: Always present (possibly empty); NOT a single value.
        colourProperties:
          $ref: '#/components/schemas/ColourProperties'
        dolbyVisionProfile:
          type: string
          description: "e.g. \"dvhe.08.06\" for Profile 8, Level 6. Absent if not Dolby Vision."
        isStereo3D:
          type: boolean
        videoCodec:
          $ref: '#/components/schemas/VideoCodec'
        sampleRate:
          type: integer
          description: Audio sample rate in Hz. Audio streams only.
        channelLayout:
          $ref: '#/components/schemas/ChannelLayout'
          description: Audio streams only — an OBJECT (`{channelCount, layoutName}`), not a bare string.
        audioBitDepth:
          type: integer
        matrixEncoding:
          $ref: '#/components/schemas/MatrixEncoding'
        audioCodec:
          $ref: '#/components/schemas/AudioCodec'
        suiteCoreCodecDescriptor:
          $ref: '#/components/schemas/SuiteCoreCodecDescriptor'
        subtitleFormat:
          $ref: '#/components/schemas/SubtitleFormat'

    ColourProperties:
      type: object
      description: Colour space / transfer function properties of a video stream. All fields optional (absent when unknown).
      properties:
        primaries:
          type: string
        transferCharacteristics:
          type: string
        matrixCoefficients:
          type: string
        bitDepth:
          type: integer
        chromaSubsampling:
          type: string
        maxCLL:
          type: integer
          description: Maximum Content Light Level in nits.
        maxFALL:
          type: integer
          description: Maximum Frame-Average Light Level in nits.
        masteringDisplayMaxLuminance:
          type: integer
        masteringDisplayMinLuminance:
          type: integer

    ChannelLayout:
      type: object
      required: [channelCount]
      properties:
        channelCount:
          type: integer
        layoutName:
          type: string
          description: "FFmpeg channel layout string, e.g. \"stereo\", \"5.1\", \"5.1(side)\". Absent if unknown."

    Chapter:
      type: object
      required: [id, number, startTime, endTime, metadata]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: 1-based chapter number.
        title:
          type: string
        startTime:
          type: number
          format: double
        endTime:
          type: number
          format: double
        metadata:
          type: object
          additionalProperties:
            type: string

    SuiteCoreCodecDescriptor:
      type: object
      description: "Lossless/spatial classification for an audio stream, sourced from SuiteCoreCodecClassifier (#372). Absent for non-audio streams or when no classification was made."
      required: [identifier, displayName, isLossless, isSpatial]
      properties:
        identifier:
          type: string
        displayName:
          type: string
        isLossless:
          type: boolean
        isSpatial:
          type: boolean
        channelLayout:
          type: string

    # -- Streaming variant (for --ladder-file) --
    StreamingVariant:
      type: object
      description: |
        A single variant in an adaptive streaming ladder, used in
        `manifest --ladder-file` JSON arrays. Because Swift's synthesised
        `Decodable` conformance does not treat `init`-level default
        values as optional, ALL EIGHT fields below are required keys in
        a hand-written ladder file — including `videoMaxBitrate` and
        `videoBufferSize` (easy to omit by mistake) and `audioBitrate`/
        `audioChannels` (which have `init` defaults of 128000/2 that only
        apply when constructing the struct in Swift code, not when
        decoding JSON).
      required:
        - label
        - width
        - height
        - videoBitrate
        - videoMaxBitrate
        - videoBufferSize
        - audioBitrate
        - audioChannels
      properties:
        label:
          type: string
          description: "Human-readable label (e.g., '1080p', '720p'). Also used as the variant subdirectory suffix."
        width:
          type: integer
          description: Output width in pixels.
        height:
          type: integer
          description: Output height in pixels.
        videoBitrate:
          type: integer
          description: Target video bitrate in bits per second.
        videoMaxBitrate:
          type: integer
          description: Maximum video bitrate in bits per second (CVBR `-maxrate`). Required — `ManifestGenerator.validate` flags this variant if it is lower than `videoBitrate`.
        videoBufferSize:
          type: integer
          description: VBV buffer size in bits (CVBR `-bufsize`).
        audioBitrate:
          type: integer
          description: Target audio bitrate in bits per second.
        audioChannels:
          type: integer
          description: Audio channel count.

    # -- Manifest config (for validate --manifest) --
    ManifestConfig:
      type: object
      description: "Full configuration decoded from `validate --manifest <file>`. `inputURL`/`outputDirectory` are file:// URLs, not plain path strings."
      required:
        - inputURL
        - outputDirectory
        - format
        - videoCodec
        - audioCodec
        - preset
        - keyframeInterval
        - segmentDuration
        - variants
        - preserveHDR
        - useHardwareEncoding
      properties:
        inputURL:
          type: string
          format: uri
        outputDirectory:
          type: string
          format: uri
        format:
          type: string
          enum: [hls, dash, cmaf]
        videoCodec:
          $ref: '#/components/schemas/VideoCodec'
        audioCodec:
          $ref: '#/components/schemas/AudioCodec'
        preset:
          type: string
        keyframeInterval:
          type: number
          format: double
        segmentDuration:
          type: number
          format: double
        variants:
          type: array
          items:
            $ref: '#/components/schemas/StreamingVariant'
        preserveHDR:
          type: boolean
          description: "As of #490, `meedya-convert manifest` can no longer produce a config with this set to `true` — `--hdr` is now rejected by `validate()` before the config is built. Still decodable as `true` when `validate --manifest <file>` is pointed at a hand-written config, since that path only runs `ManifestGenerator.validate(config:)`'s warnings, not `manifest`'s own `--hdr` rejection."
        pixelFormat:
          type: string
        useHardwareEncoding:
          type: boolean

    # -- Encoding profile (profiles --show/--export/--import --json; nested in EncodingJobConfig) --
    EncodingProfile:
      type: object
      description: |
        A reusable encoding preset. Serialised/deserialised via Swift's
        synthesised `Codable` conformance — the `required` list below is
        the set of non-`Optional`-typed stored properties, which MUST be
        present when importing a profile via `profiles --import` or
        `validate --profile-file` even though many of them have friendly
        defaults in the Swift `init` (those defaults only apply when
        constructing the struct from code, not from JSON).
      required:
        - id
        - name
        - description
        - category
        - isBuiltIn
        - videoPassthrough
        - useHardwareEncoding
        - encodingPasses
        - preserveHDR
        - toneMapToSDR
        - convertPQToHLG
        - useHlgTools
        - convertPQToDVHLG
        - audioPassthrough
        - applyPeakLimiter
        - subtitlePassthrough
        - containerFormat
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [quick_start, streaming, disc, archival, custom]
        isBuiltIn:
          type: boolean
        videoCodec:
          $ref: '#/components/schemas/VideoCodec'
        videoPassthrough:
          type: boolean
        videoCRF:
          type: integer
        videoQP:
          type: integer
          description: Used instead of CRF for hardware encoders.
        videoBitrate:
          type: integer
        videoMaxBitrate:
          type: integer
        videoPreset:
          type: string
        videoTune:
          type: string
        outputWidth:
          type: integer
        outputHeight:
          type: integer
        outputFrameRate:
          type: number
          format: double
        pixelFormat:
          type: string
        useHardwareEncoding:
          type: boolean
        encodingPasses:
          type: integer
        preserveHDR:
          type: boolean
        toneMapToSDR:
          type: boolean
        toneMapAlgorithm:
          type: string
          description: "Free-form string field on the profile. Only resolved into an actual tone-map algorithm if it matches `FFmpegArgumentBuilder.ToneMapAlgorithm`'s raw values (hable, reinhard, mobius, bt2390, clip); otherwise ignored."
        convertPQToHLG:
          type: boolean
        useHlgTools:
          type: boolean
        toneMapPeakNits:
          type: number
          format: double
        toneMapDesaturation:
          type: number
          format: double
        convertPQToDVHLG:
          type: boolean
        displayAspectRatio:
          type: string
        audioCodec:
          $ref: '#/components/schemas/AudioCodec'
        audioPassthrough:
          type: boolean
        audioBitrate:
          type: integer
        audioSampleRate:
          type: integer
        audioChannels:
          type: integer
        loudnessNormalization:
          type: string
        applyPeakLimiter:
          type: boolean
        subtitlePassthrough:
          type: boolean
        subtitleTonemap:
          type: object
          description: HDR subtitle tone-mapping config (#369/#396). Not settable from any CLI flag — present only in profiles authored via the GUI.
        perStreamSettings:
          type: object
          description: Per-stream codec/bitrate overrides (#41). Not settable from any CLI flag.
        containerFormat:
          $ref: '#/components/schemas/ContainerFormat'
        keyframeIntervalSeconds:
          type: number
          format: double
        videoBufferSize:
          type: integer

    # -- Batch job file schema --
    EncodingJobConfig:
      type: object
      description: |
        A single encoding job definition used in `batch --job-file` JSON
        arrays. This is the CLI/engine's full internal job struct, not a
        simplified input/output pair — Swift's synthesised `Decodable`
        conformance requires every non-`Optional` stored property to be
        present. `batch --job-file` uses a plain `JSONDecoder()` with NO
        custom date strategy, so `createdAt` must be a raw number
        (seconds since 2001-01-01, `timeIntervalSinceReferenceDate`), NOT
        an ISO 8601 string — unlike `probe --format json`'s output, which
        does use `.iso8601`. For a hand-written job file, set
        `outputMetadata: {}`, `streamMetadata: {}`, `extraArguments: []`,
        `subtitleStreamActions: []`, and `priority: 0` to satisfy the
        decoder without meaningfully affecting the job.
      required:
        - id
        - inputURL
        - outputURL
        - profile
        - mapAllStreams
        - outputMetadata
        - streamMetadata
        - extraArguments
        - subtitleStreamActions
        - createdAt
        - priority
      properties:
        id:
          type: string
          format: uuid
        inputURL:
          type: string
          format: uri
          description: "file:// URL to the input media file (a plain path string will fail to decode as a URL)."
        outputURL:
          type: string
          format: uri
        profile:
          $ref: '#/components/schemas/EncodingProfile'
        videoStreamIndex:
          type: integer
        audioStreamIndex:
          type: integer
        subtitleStreamIndex:
          type: integer
        mapAllStreams:
          type: boolean
        outputMetadata:
          type: object
          additionalProperties:
            type: string
        streamMetadata:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        videoFilterChain:
          type: string
        audioFilterChain:
          type: string
        extraArguments:
          type: array
          items:
            type: string
          description: Additional raw FFmpeg arguments appended to the command.
        hdrMasteringDisplay:
          type: string
        hdrMaxCLL:
          type: integer
        hdrMaxFALL:
          type: integer
        hdrMasteringDisplayMaxLuminance:
          type: integer
        hdrMasteringDisplayMinLuminance:
          type: integer
        hdrTransferFunction:
          type: string
          enum: [pq, hlg]
        subtitleStreamActions:
          type: array
          items:
            type: object
            description: "`{streamIndex: Int, action: \"passthrough\"|\"drop\"|{\"replaceWith\": \"<file:// URL>\"}}`. Populated internally by the encoding engine; pass `[]` in hand-written job files."
        createdAt:
          type: number
          format: double
          description: Seconds since the Swift reference date (2001-01-01T00:00:00Z) — see the schema-level description note about the job-file decoder's date strategy.
        priority:
          type: integer
          description: Queue ordering priority (higher = processed first). Only meaningful for GUI-driven `EncodingQueue`; `batch --job-file` processes jobs strictly in array order and ignores this field.

    # -- Reusable enums, verified against ConverterEngine source --
    VideoCodec:
      type: string
      description: "Full `VideoCodec` raw-value list (Sources/ConverterEngine/Models/VideoCodec.swift). There is no `copy` case — passthrough is `--video-passthrough`, a separate flag."
      enum:
        - h264
        - h265
        - h266
        - mv_hevc
        - mv_h264
        - vp8
        - vp9
        - av1
        - av2
        - prores
        - dnxhr
        - cineform
        - mpeg2
        - mpeg4
        - theora
        - vc1
        - ffv1
        - jpeg2000

    AudioCodec:
      type: string
      description: "Full `AudioCodec` raw-value list (Sources/ConverterEngine/Models/AudioCodec.swift). There is no `copy` case — passthrough is `--audio-passthrough`, a separate flag."
      enum:
        - aac
        - he_aac
        - he_aac_v2
        - xhe_aac
        - ac3
        - eac3
        - truehd
        - ac4
        - dts
        - dts_hd
        - dts_x
        - pcm
        - mp3
        - mp2
        - flac
        - alac
        - opus
        - vorbis
        - speex
        - dsd
        - wavpack
        - mqa
        - musepack
        - ape
        - tta
        - wma
        - atrac
        - dolby_mat
        - iamf
        - mpeg_h_3d
        - 360ra
        - asaf
        - ambisonics
        - auro_3d
        - nhk_22_2
        - ac4_ajoc
        - mp3_surround
        - imax_enhanced

    ContainerFormat:
      type: string
      description: "Full `ContainerFormat` raw-value list (Sources/ConverterEngine/Models/ContainerFormat.swift)."
      enum:
        - mp4
        - m4v
        - m4a
        - m4b
        - m4p
        - mkv
        - mka
        - mks
        - mk3d
        - mov
        - webm
        - ts
        - mpg
        - mxf
        - avi
        - flv
        - 3gp
        - 3g2
        - ogg
        - ogm
        - hls
        - dash
        - aiff
        - caf
        - w64
        - rf64
        - dcp

    ToneMapAlgorithm:
      type: string
      description: "`FFmpegArgumentBuilder.ToneMapAlgorithm` — the enum that actually governs `encode --tonemap-algorithm`. Note this differs from the similarly-named enum in ColorSpaceConverter.swift, which has `linear` instead of `clip`; the CLI flag uses THIS one."
      enum:
        - hable
        - reinhard
        - mobius
        - bt2390
        - clip

    Platform:
      type: string
      description: "`PlatformFormatPolicy.Platform` raw-value list."
      enum:
        - macOS
        - iOS
        - tvOS
        - windows
        - android
        - chromecast
        - webBrowser
        - plex
        - jellyfin
        - roku
        - fireTV

    HDRFormat:
      type: string
      enum:
        - hdr10
        - "hdr10+"
        - dolby_vision
        - dolby_vision_hdr10
        - hlg
        - pq
        - sdr

    SubtitleFormat:
      type: string
      enum:
        - srt
        - ttml
        - vtt
        - ssa
        - sami
        - lrc
        - cc608
        - cc708
        - dvb_sub
        - pgs
        - vob_sub
        - ebu_stl
        - scc
        - mcc
        - teletext

    MatrixEncoding:
      type: string
      enum:
        - dolby_surround
        - prologic_ii
        - prologic_iix
        - dolby_ex
        - dolby_surround_upmixer
        - dts_es
        - dts_neo6
        - dts_neural_x
        - circle_surround
        - mpeg_surround

    # -- Exit codes --
    ExitCodes:
      type: object
      description: |
        POSIX-compliant exit codes for the meedya-convert CLI.
        These allow scripts and CI pipelines to determine the reason for
        failure without parsing error messages.
      properties:
        success:
          type: integer
          const: 0
          description: Success — command completed normally.
        generalError:
          type: integer
          const: 1
          description: General/unspecified error.
        invalidArguments:
          type: integer
          const: 2
          description: Invalid arguments or usage error.
        inputNotFound:
          type: integer
          const: 3
          description: Input file not found or unreadable.
        encodingFailed:
          type: integer
          const: 4
          description: Encoding failed (FFmpeg returned an error).
        outputWriteError:
          type: integer
          const: 5
          description: Output write error (permissions, disk full, path invalid).
        validationFailed:
          type: integer
          const: 6
          description: Validation failed (profile or manifest validation errors).
        interrupted:
          type: integer
          const: 130
          description: Interrupted by signal (SIGINT / Ctrl+C).

    # -- Progress JSON (emitted to stderr during encode) --
    ProgressEvent:
      type: object
      description: JSON progress event emitted to stderr when `encode --json` is active.
      properties:
        progress:
          type: integer
          description: Completion percentage (0-100).
          minimum: 0
          maximum: 100
